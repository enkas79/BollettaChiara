[project]
name = "bollettachiara"
description = "Analizzatore bollette Luce, Gas e Acqua da PDF"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
gui = [
    "PyQt6",
    "pdfplumber",
    "matplotlib",
    "reportlab",
]
test = [
    "pytest",
]

[tool.setuptools]
packages = ["bollettachiara"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"
